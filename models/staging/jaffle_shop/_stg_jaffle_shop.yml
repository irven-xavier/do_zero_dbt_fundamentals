models:
  - name: stg__jaffle_shop__customers
    description: one unique customer per row
    columns: 
      - name: customer_id
        description: customers' table primary key
        data_tests: 
          - unique
          - not_null

  - name: stg__jaffle_shop__orders
    columns: 
      - name: order_id
        data_tests: 
          - unique
          - not_null
      - name: status
        description: '{{ doc("order_status") }}'
        data_tests: 
          - accepted_values: 
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg__jaffle_shop__customers')
                field: customer_id